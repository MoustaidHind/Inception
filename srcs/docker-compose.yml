services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    restart: always
    expose:
      - "6379"
    networks:
      - inception

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    restart: always
    env_file: .env
    ports:
      - "21:21"
      - "40000-40100:40000-40100"
    volumes:
      - wordpress_data:/var/www/wordpress
    networks:
      - inception

  website:
    build: ./requirements/bonus/website
    container_name: website
    restart: always
    ports:
      - "3000:3000"
    networks:
      - inception


networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data: